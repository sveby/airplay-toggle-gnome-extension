# Disables AirPlay discovery loaded by PipeWire config (e.g. Fedora's pipewire-config-raop).
# Install to ~/.config/pipewire/pipewire.conf.d/50-raop.conf, then:
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# AirPlay is instead toggled at runtime by the "AirPlay Toggle" GNOME extension
# (pactl load-module / unload-module module-raop-discover).
context.properties = {
    module.raop = false
}
